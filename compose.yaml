name: flowpilot

services:
  app:
    build:
      context: .
      target: app
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:8080
      AllowedHosts: localhost;127.0.0.1
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-flowpilot};Username=${POSTGRES_USER:-flowpilot};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local .env}"
    ports:
      - "127.0.0.1:${APP_PORT:-5080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: migrate
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-flowpilot};Username=${POSTGRES_USER:-flowpilot};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local .env}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:16.14-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flowpilot}
      POSTGRES_USER: ${POSTGRES_USER:-flowpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
